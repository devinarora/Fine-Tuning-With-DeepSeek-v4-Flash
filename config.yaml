model_id: google/flan-t5-base
dataset_id: Helsinki-NLP/opus-100
dataset_config: en-fr

data:
  max_length: 128
  train_subset: 40000
  valid_subset: 2000
  test_subset: 2000
  eval_subset: 400
  padding: true

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.1
  target_modules:
    - q
    - k
    - v
    - o
    - wi_0
    - wi_1
    - wo

training:
  output_dir: outputs
  overwrite_output_dir: true
  num_train_epochs: 2
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 1
  learning_rate: 3.0e-4
  warmup_steps: 100
  weight_decay: 0.01
  logging_steps: 50
  eval_strategy: steps
  eval_steps: 2000
  save_strategy: steps
  save_steps: 2000
  save_total_limit: 2
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  fp16: false
  bf16: true
  predict_with_generate: true
  generation_max_length: 128
  seed: 42
  dataloader_num_workers: 2
  optim: adamw_torch
  lr_scheduler_type: linear

evaluation:
  max_samples: 200
  batch_size: 16
  metrics:
    - bleu
    - chrf
    - bertscore